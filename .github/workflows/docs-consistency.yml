name: Docs consistency

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-consistency:
    name: Docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate PR description
        if: github.event_name == 'pull_request'
        run: npm run pr:body-check

      - name: Install docs checker dependencies
        run: npm ci

      - name: Run PR preflight tests
        run: npm run pr:test

      - name: Run autonomy reconciliation tests
        run: npm run autonomy:test

      - name: Run docs consistency check
        env:
          BASE_REF: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: npm run docs:check -- --base "$BASE_REF"
