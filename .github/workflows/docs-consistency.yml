name: Docs consistency

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: docs-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-consistency:
    name: Docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate PR description
        run: npm run pr:body-check

      - name: Install docs checker dependencies
        run: npm ci

      - name: Run PR preflight tests
        run: npm run pr:test

      - name: Run autonomy reconciliation tests
        run: npm run autonomy:test

      - name: Run docs consistency check
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npm run docs:check -- --base "$BASE_REF"
