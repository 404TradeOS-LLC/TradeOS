name: Recover Vercel main deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: vercel-main-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-vercel-handoff:
    if: github.repository == '404TradeOS-LLC/TradeOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Re-request stalled Vercel check suite
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function readVercelSuite() {
              const suites = await github.request(
                'GET /repos/{owner}/{repo}/commits/{ref}/check-suites',
                {
                  owner,
                  repo,
                  ref: sha,
                  per_page: 100,
                  headers: { 'X-GitHub-Api-Version': '2022-11-28' },
                },
              );
              const suite = suites.data.check_suites.find(
                (candidate) => candidate.app?.slug === 'vercel',
              );
              if (!suite) return { suite: null, runCount: 0 };

              const runs = await github.request(
                'GET /repos/{owner}/{repo}/check-suites/{check_suite_id}/check-runs',
                {
                  owner,
                  repo,
                  check_suite_id: suite.id,
                  per_page: 100,
                  headers: { 'X-GitHub-Api-Version': '2022-11-28' },
                },
              );
              return { suite, runCount: runs.data.total_count };
            }

            let observed = { suite: null, runCount: 0 };
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              observed = await readVercelSuite();
              if (
                observed.suite &&
                (observed.runCount > 0 || observed.suite.status !== 'queued')
              ) {
                core.info(
                  `Vercel handoff already active for ${sha}: ` +
                    `suite=${observed.suite.id} status=${observed.suite.status} ` +
                    `runs=${observed.runCount}`,
                );
                return;
              }
              if (attempt < 6) await sleep(5000);
            }

            if (!observed.suite) {
              core.setFailed(`No Vercel check suite appeared for main SHA ${sha}.`);
              return;
            }

            if (observed.suite.status !== 'queued' || observed.runCount !== 0) {
              core.info(
                `No recovery needed: suite=${observed.suite.id} ` +
                  `status=${observed.suite.status} runs=${observed.runCount}`,
              );
              return;
            }

            core.warning(
              `Vercel suite ${observed.suite.id} is queued with zero runs; re-requesting it.`,
            );
            await github.request(
              'POST /repos/{owner}/{repo}/check-suites/{check_suite_id}/rerequest',
              {
                owner,
                repo,
                check_suite_id: observed.suite.id,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              },
            );

            for (let attempt = 1; attempt <= 6; attempt += 1) {
              await sleep(10000);
              const recovered = await readVercelSuite();
              if (
                recovered.suite &&
                (recovered.runCount > 0 || recovered.suite.status !== 'queued')
              ) {
                core.info(
                  `Vercel handoff recovered for ${sha}: ` +
                    `suite=${recovered.suite.id} status=${recovered.suite.status} ` +
                    `runs=${recovered.runCount}`,
                );
                return;
              }
            }

            core.setFailed(
              `Vercel suite ${observed.suite.id} remained queued with zero runs after re-request.`,
            );
