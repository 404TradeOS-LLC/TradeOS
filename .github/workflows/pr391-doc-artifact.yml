name: PR391 current-state patch artifact

on:
  push:
    branches:
      - fix/local-session-refresh-cookie

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build patched current-state file from current main
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p artifacts/pr391-doc
          git show origin/main:docs/CURRENT_STATE.md > artifacts/pr391-doc/CURRENT_STATE.md
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/pr391-doc/CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          needle = '- Auth and tenancy\n'
          addition = "- Local-session proxy refresh hardening: protected routes treat either local auth cookie as local-session intent; when the short-lived access cookie has expired from the browser but the 30-day refresh cookie remains, the proxy uses the existing local refresh flow instead of falling through to Supabase/login. Refresh-only failures remain fail-closed to `/login`; a concurrent single-use refresh-rotation loser intentionally emits no local-cookie deletions that could overwrite a sibling response's rotated replacement cookies, while stale requests that still carry a local access cookie retain explicit cleanup. Cookie lifetimes, backend refresh-token policy, auth/permission/RLS boundaries, schema, secrets, billing, and architecture are unchanged.\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one auth anchor, found {text.count(needle)}')
          if addition not in text:
              text = text.replace(needle, needle + addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -F 'Local-session proxy refresh hardening:' artifacts/pr391-doc/CURRENT_STATE.md
          wc -c artifacts/pr391-doc/CURRENT_STATE.md
      - uses: actions/upload-artifact@v7
        with:
          name: pr391-current-state
          path: artifacts/pr391-doc/CURRENT_STATE.md
          if-no-files-found: error
          retention-days: 1
