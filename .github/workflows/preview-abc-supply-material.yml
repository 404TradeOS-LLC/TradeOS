name: Preview one ABC Supply Material

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: TradeOS organization UUID from Settings > Costbook > Supplier workflow IDs
        required: true
        type: string
      user_id:
        description: Active owner/admin AppUser UUID from the same Settings panel
        required: true
        type: string
      product_key:
        description: Exact reviewed ABC supplier product key (example ABC-654210)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: abc-material-preview-production
  cancel-in-progress: false

jobs:
  preview:
    name: Preview tenant-scoped ABC Material candidate (no writes)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate reviewed preview inputs
        env:
          ORG_ID: ${{ inputs.org_id }}
          USER_ID: ${{ inputs.user_id }}
          PRODUCT_KEY: ${{ inputs.product_key }}
        run: |
          set -euo pipefail
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          if [[ ! "$ORG_ID" =~ $uuid_re || ! "$USER_ID" =~ $uuid_re ]]; then
            echo "Refusing preview: valid organization and owner/admin UUIDs are required." >&2
            exit 1
          fi
          if [[ ! "$PRODUCT_KEY" =~ ^[a-zA-Z0-9:_-]{1,100}$ ]]; then
            echo "Refusing preview: product key contains unsupported characters." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify guarded operator contract
        run: npx jest --runInBand --runTestsByPath tests/supplier-integration.abc-material-activation-operator.test.ts

      - name: Preview reviewed ABC supplier product (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          APP_DB_ROLE_PASSWORD: ${{ secrets.APP_DB_ROLE_PASSWORD }}
          APP_DB_ROLE_NAME: ${{ secrets.APP_DB_ROLE_NAME }}
          ORG_ID: ${{ inputs.org_id }}
          USER_ID: ${{ inputs.user_id }}
          PRODUCT_KEY: ${{ inputs.product_key }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            if [[ -z "${DATABASE_ADMIN_URL:-}" || -z "${APP_DB_ROLE_PASSWORD:-}" ]]; then
              echo "Refusing preview: no restricted-role connection credentials are configured." >&2
              exit 1
            fi
            DATABASE_URL="$(node -e 'const u = new URL(process.env.DATABASE_ADMIN_URL); const role = process.env.APP_DB_ROLE_NAME || "tradeos_app"; const admin = decodeURIComponent(u.username); const pooler = u.hostname.endsWith(".pooler.supabase.com"); const suffix = pooler && admin.includes(".") ? admin.slice(admin.indexOf(".")) : ""; if (!["postgres:", "postgresql:"].includes(u.protocol) || !/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(role) || role === "postgres" || role === admin.split(".")[0] || (pooler && !/^\.[a-z0-9]+$/.test(suffix))) process.exit(1); u.username = role + suffix; u.password = process.env.APP_DB_ROLE_PASSWORD; process.stdout.write(u.toString());')"
            export DATABASE_URL
          fi
          if [[ -n "${DATABASE_ADMIN_URL:-}" && "$DATABASE_URL" == "$DATABASE_ADMIN_URL" ]]; then
            echo "Refusing preview: the admin connection is not allowed." >&2
            exit 1
          fi
          # Intentionally no --apply, --approved-unit-cost, or --confirmation input.
          npx ts-node scripts/activate-abc-supply-material.ts \
            --org-id "$ORG_ID" \
            --user-id "$USER_ID" \
            --product-key "$PRODUCT_KEY" | tee /tmp/abc-material-preview.log
          {
            echo "## ABC Supply material preview — no writes"
            echo
            tail -n 1 /tmp/abc-material-preview.log
            echo
            echo "This is historical supplier evidence, not a successful ABC sandbox quote."
            echo "Activation requires separate source SKU, stocking unit, and initial-cost approval."
          } >> "$GITHUB_STEP_SUMMARY"
