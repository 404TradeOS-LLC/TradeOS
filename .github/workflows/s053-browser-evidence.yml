name: S053 authenticated browser evidence

on:
  push:
    branches:
      - evidence/s053-current-main-20261002

permissions:
  contents: read

concurrency:
  group: tradeos-beta-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: S053 scope-to-estimate evidence 1440/768/390
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: app
    env:
      S053_BASE_URL: https://tradeos-costbook-89hfag41t-billykshowalters.vercel.app
      S053_EXPECTED_SHA: 596427ce0c1e6206892cf8eabc0797561ecd45cc
      S053_SANITIZED_TENANT: "true"
      S053_ALLOW_MUTATIONS: "true"
      S053_STORAGE_STATE_PATH: /tmp/s053-storage-state.json
      S053_EVIDENCE_DIR: ../artifacts/s053-browser-evidence
      S027_BASE_URL: https://tradeos-costbook-89hfag41t-billykshowalters.vercel.app
      S027_EXPECTED_SHA: 596427ce0c1e6206892cf8eabc0797561ecd45cc
      S027_SANITIZED_TENANT: "true"
      S027_ALLOW_MUTATIONS: "true"
      S027_STORAGE_STATE_PATH: /tmp/s053-storage-state.json
      S027_EVIDENCE_DIR: ../artifacts/s053-browser-evidence
      BETA_RC_BASE_URL_RESOLVED: https://tradeos-costbook-89hfag41t-billykshowalters.vercel.app
      BETA_SMOKE_EMAIL: ${{ secrets.BETA_RC_SMOKE_EMAIL }}
      BETA_SMOKE_PASSWORD: ${{ secrets.BETA_RC_SMOKE_PASSWORD }}
      BETA_SMOKE_ORG_LABEL: TradeOS Beta Smoke
      BETA_SMOKE_ORG_ID: 9814bd72-626a-42f4-8871-cd755cb9d685
      BETA_RC_SUPABASE_PROJECT_REF: ${{ secrets.BETA_RC_SUPABASE_PROJECT_REF }}
      BETA_STORAGE_STATE_PATH: /tmp/s053-storage-state.json
      BETA_EVIDENCE_DIR: ../artifacts/s053-browser-evidence
      BETA_RC_FOREIGN_ESTIMATE_ID: ${{ secrets.BETA_RC_FOREIGN_ESTIMATE_ID }}
      BETA_RC_FOREIGN_PROJECT_ID: ${{ secrets.BETA_RC_FOREIGN_PROJECT_ID }}
      BETA_RC_FOREIGN_CUSTOMER_ID: ${{ secrets.BETA_RC_FOREIGN_CUSTOMER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prove evidence target is runtime-equivalent to pinned current main
        shell: bash
        env:
          S053_CURRENT_MAIN_SHA: a1b629e8d06b67506c101c4a80f25d898d8c621f
          S053_TARGET_BRANCH: ops/staging-sync-s053-desktop-20261002
        run: |
          set -euo pipefail
          git fetch origin "$S053_TARGET_BRANCH" main --quiet
          git cat-file -e "$S053_EXPECTED_SHA^{commit}"
          git cat-file -e "$S053_CURRENT_MAIN_SHA^{commit}"
          git diff --exit-code "$S053_EXPECTED_SHA" "$S053_CURRENT_MAIN_SHA" -- \
            app web packages/knowledge-engine \
            ':(exclude)web/**/*.test.*' \
            ':(exclude)web/**/*.spec.*'
          echo "S053 target runtime paths match pinned current main; only non-runtime test/docs drift may remain."
          git cat-file -e "a3fbafaaec3eac39e11f9f1908d40cd8e5b56c44^{commit}"
          git diff --exit-code "a3fbafaaec3eac39e11f9f1908d40cd8e5b56c44" "$S053_CURRENT_MAIN_SHA" -- app packages/knowledge-engine
          echo "Stable staging backend runtime paths match pinned current main."
      - run: npm ci
      - run: node --check scripts/s053-browser-evidence.mjs
      - run: node --check scripts/s053-preview-pair.mjs
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Prepare exact S053 staging Preview pair
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/s053-preview-pair.mjs
      - name: Verify preview deployment identity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/s027-deployment-identity.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticate dedicated smoke tenant
        run: node scripts/beta-evidence/auth-setup.mjs
      - name: Capture S053 authenticated evidence
        run: node scripts/s053-browser-evidence.mjs
      - name: Verify deployment did not change during capture
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/s027-deployment-identity.mjs --verify
      - name: Remove temporary S053 Preview environment overrides
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/s053-preview-pair.mjs --cleanup
      - name: Remove runtime storage state
        if: always()
        run: rm -f "$S053_STORAGE_STATE_PATH"
      - name: Scan artifact for credential material
        id: credential_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bundle="../artifacts/s053-browser-evidence"
          [ -d "$bundle" ] || exit 1
          if grep -rlIE '"cookies"[[:space:]]*:|sb-[a-z0-9-]+-auth-token|tradeos_(access|refresh)_token|Bearer [A-Za-z0-9._-]{20,}' "$bundle" >/dev/null 2>&1; then
            echo "::error::Credential material detected; refusing artifact upload."
            exit 1
          fi
      - name: Upload evidence artifact
        if: ${{ always() && steps.credential_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: s053-browser-evidence-${{ github.run_id }}
          path: artifacts/s053-browser-evidence
          if-no-files-found: error
          retention-days: 30
