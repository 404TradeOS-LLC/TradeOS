name: PR branch currency

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-branch-currency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  currency:
    name: Branch current with main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check branch currency
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          if git merge-base --is-ancestor "origin/$BASE_REF" "$HEAD_SHA"; then
            echo "PR head contains the current $BASE_REF."
            exit 0
          fi
          echo "::error::PR branch is behind $BASE_REF. Use the governed PR maintenance/rebase workflow before merge."
          exit 1
