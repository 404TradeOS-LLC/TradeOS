name: Deploy staging database migrations

# Manual, staging-only Prisma migration deployment. This workflow uses a
# dedicated GitHub Environment and secret names; it cannot select production.
on:
  workflow_dispatch:
    inputs:
      invoice_contract_confirmation:
        description: "After independent retirement proof, type APPROVE_INVOICE_CONTRACT (required while contract migration is pending)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-migrations-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Prisma migrations to TradeOS Staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_ADMIN_URL: ${{ secrets.STAGING_DATABASE_ADMIN_URL }}
      APP_DB_ROLE_PASSWORD: ${{ secrets.STAGING_APP_DB_ROLE_PASSWORD }}
      APP_DB_ROLE_NAME: ${{ vars.STAGING_APP_DB_ROLE_NAME }}
      STAGING_PROJECT_REF: qfbgdkbamfaasmtjfyru
      PGSSLMODE: require
    steps:
      - name: Verify main ref and staging credentials
        working-directory: . # repository is not checked out yet
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Dispatch this workflow from main only."
            exit 1
          }
          test -n "$DATABASE_ADMIN_URL" || {
            echo "::error::Configure STAGING_DATABASE_ADMIN_URL in the staging GitHub Environment."
            exit 1
          }
          test -n "$APP_DB_ROLE_PASSWORD" || {
            echo "::error::Configure STAGING_APP_DB_ROLE_PASSWORD in the staging GitHub Environment."
            exit 1
          }
          node --input-type=module <<'NODE'
          let url;
          try {
            url = new URL(process.env.DATABASE_ADMIN_URL);
          } catch {
            console.error("STAGING_DATABASE_ADMIN_URL is not a valid PostgreSQL URL.");
            process.exit(1);
          }
          const directHost = `db.${process.env.STAGING_PROJECT_REF}.supabase.co`;
          const poolerHost = "aws-0-us-east-2.pooler.supabase.com";
          const poolerUsername = decodeURIComponent(url.username);
          const directMatch = url.hostname === directHost &&
            (url.port === "" || url.port === "5432");
          const poolerMatch = url.hostname === poolerHost &&
            (url.port === "5432" || url.port === "6543") &&
            /^[a-zA-Z_][a-zA-Z0-9_]*\.[a-z0-9]{20}$/.test(poolerUsername) &&
            poolerUsername.endsWith("." + process.env.STAGING_PROJECT_REF);
          if (!["postgres:", "postgresql:"].includes(url.protocol) ||
              url.pathname !== "/postgres" || !(directMatch || poolerMatch)) {
            console.error("Refusing migration: STAGING_DATABASE_ADMIN_URL is not a verified staging database identity (direct host or pooler with project-ref username).");
            process.exit(1);
          }
          console.log(`Verified staging database host ${url.hostname}; credentials were not printed.`);
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install app dependencies
        run: npm ci

      - name: Refuse conflicting invoice expand schema and Prisma ledger
        run: |
          set -euo pipefail
          # A separate Supabase migration already expanded this schema in some
          # staging databases without recording the tracked Prisma migration.
          # Fail before migrate deploy applies any other pending migrations.
          PSQL_ADMIN_URL="${DATABASE_ADMIN_URL%%\?*}"
          invoice_expand_state="$(psql "$PSQL_ADMIN_URL" -X -v ON_ERROR_STOP=1 -Atqc "
            WITH invoice_price_columns AS (
              SELECT count(*) AS present
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'invoice_line_items'
                AND column_name IN ('unit_price', 'line_total')
            ), prisma_expand AS (
              SELECT EXISTS (
                SELECT 1 FROM public._prisma_migrations
                WHERE migration_name = '20260902193000_rename_invoice_line_price_columns'
                  AND finished_at IS NOT NULL
                  AND rolled_back_at IS NULL
              ) AS applied
            )
            SELECT CASE
              WHEN invoice_price_columns.present > 0 AND NOT prisma_expand.applied
                THEN 'untracked_existing_expand'
              WHEN invoice_price_columns.present <> 2 AND prisma_expand.applied
                THEN 'ledger_schema_mismatch'
              ELSE 'ok'
            END
            FROM invoice_price_columns CROSS JOIN prisma_expand
          ")"
          case "$invoice_expand_state" in
            ok) echo "Invoice expand schema and Prisma ledger precheck passed." ;;
            untracked_existing_expand)
              echo "::error::Staging invoice selling-price columns exist, but the matching tracked Prisma expand migration is not recorded. Reconcile the historical Supabase migration and Prisma ledger with reviewed evidence before deploying; no migrations were applied."
              exit 1
              ;;
            ledger_schema_mismatch)
              echo "::error::Prisma records the invoice expand migration, but both expected price columns are not present. Repair reviewed schema drift before deploying; no migrations were applied."
              exit 1
              ;;
            *)
              echo "::error::Invoice expand preflight returned an unknown state; refusing staging migration."
              exit 1
              ;;
          esac

      - name: Check invoice migration preconditions
        run: |
          # Prisma allows ?schema=public; libpq rejects this query parameter.
          # Keep the full URL for Prisma; use the libpq-safe URL only for psql.
          PSQL_ADMIN_URL="${DATABASE_ADMIN_URL%%\?*}"
          legacy_columns="$(psql "$PSQL_ADMIN_URL" -X -v ON_ERROR_STOP=1 -Atqc "
            SELECT count(*)
            FROM information_schema.columns
            WHERE table_schema = 'public'
              AND table_name = 'invoice_line_items'
              AND column_name IN ('unit_cost', 'line_cost')
          ")"
          if [ "$legacy_columns" = "2" ]; then
            null_legacy_costs="$(psql "$PSQL_ADMIN_URL" -X -v ON_ERROR_STOP=1 -Atqc "
              SELECT count(*)
              FROM public.invoice_line_items
              WHERE unit_cost IS NULL OR line_cost IS NULL
            ")"
            if [ "$null_legacy_costs" != "0" ]; then
              echo "::error::Invoice migration precheck found $null_legacy_costs rows with null legacy costs."
              exit 1
            fi
            echo "Invoice legacy-cost backfill precheck passed."
          elif [ "$legacy_columns" = "0" ]; then
            echo "Legacy invoice-cost columns are already absent; precheck is not needed."
          else
            echo "::error::Invoice legacy-cost columns are in a partial state; refusing migration."
            exit 1
          fi

      - name: Require evidence-backed approval before dropping legacy invoice columns
        shell: bash
        env:
          INVOICE_CONTRACT_CONFIRMATION: ${{ inputs.invoice_contract_confirmation }}
          APPROVED_RETIREMENT_SHA: ${{ vars.STAGING_INVOICE_WRITERS_RETIRED_SHA }}
        run: |
          set -euo pipefail
          PSQL_ADMIN_URL="${DATABASE_ADMIN_URL%%\?*}"
          contract_applied="$(psql "$PSQL_ADMIN_URL" -X -v ON_ERROR_STOP=1 -Atqc "
            SELECT count(*) FROM public._prisma_migrations
            WHERE migration_name='20260902200000_contract_invoice_line_price_columns'
              AND finished_at IS NOT NULL AND rolled_back_at IS NULL
          ")"
          if [ "$contract_applied" = "0" ]; then
            # The next tracked migration drops columns still used by older
            # API writers. A reviewed, SHA-bound retirement attestation is
            # mandatory: workflow_dispatch confirmation alone is insufficient.
            if [ "${INVOICE_CONTRACT_CONFIRMATION:-}" != "APPROVE_INVOICE_CONTRACT" ] ||
               [ -z "${APPROVED_RETIREMENT_SHA:-}" ] ||
               [ "$APPROVED_RETIREMENT_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Invoice contract migration remains pending. Confirm all old staging writers are retired and both active staging Vercel aliases serve approved SHA $GITHUB_SHA. Then set staging Environment variable STAGING_INVOICE_WRITERS_RETIRED_SHA to that exact SHA and dispatch from main with APPROVE_INVOICE_CONTRACT. No migration applied."
              exit 1
            fi
            echo "Reviewed invoice-writer retirement attestation matches exact workflow SHA."
          elif [ "$contract_applied" != "1" ]; then
            echo "::error::Unexpected invoice contract migration ledger state."
            exit 1
          fi

      - name: Deploy tracked Prisma migrations and provision app role
        run: |
          set -euo pipefail
          # Prisma migrate deploy needs a stable session; shared Transaction
          # pooling (:6543) is unsuitable for migration commands. Reuse the
          # protected secret with the same verified staging host/user in
          # session mode (:5432). psql checks elsewhere keep the secret as-is.
          DATABASE_ADMIN_URL="$(node --input-type=module <<'NODE'
          const url = new URL(process.env.DATABASE_ADMIN_URL);
          const directHost = "db." + process.env.STAGING_PROJECT_REF + ".supabase.co";
          const poolerHost = "aws-0-us-east-2.pooler.supabase.com";
          const user = decodeURIComponent(url.username);
          const direct = url.hostname === directHost &&
            (url.port === "" || url.port === "5432");
          const pooler = url.hostname === poolerHost &&
            (url.port === "6543" || url.port === "5432") &&
            /^[a-zA-Z_][a-zA-Z0-9_]*\.[a-z0-9]{20}$/.test(user) &&
            user.endsWith("." + process.env.STAGING_PROJECT_REF);
          if (!["postgres:", "postgresql:"].includes(url.protocol) ||
              url.pathname!== "/postgres" ||!(direct || pooler)) {
            throw Error("Staging migration requires verified direct or session-pooler identity");
          }
          if (pooler) url.port = "5432";
          url.searchParams.delete("pgbouncer");
          process.stdout.write(url.toString());
          NODE
          )"
          export DATABASE_ADMIN_URL
          bash scripts/deploy-migrations.sh

      - name: Verify Prisma migration ledger
        run: |
          PSQL_ADMIN_URL="${DATABASE_ADMIN_URL%%\?*}"
          expected="$(find prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql | wc -l | tr -d ' ')"
          applied="$(psql "$PSQL_ADMIN_URL" -X -v ON_ERROR_STOP=1 -Atqc "
            SELECT count(*)
            FROM public._prisma_migrations
            WHERE finished_at IS NOT NULL
              AND rolled_back_at IS NULL
          ")"
          unfinished="$(psql "$PSQL_ADMIN_URL" -X -v ON_ERROR_STOP=1 -Atqc "
            SELECT count(*)
            FROM public._prisma_migrations
            WHERE finished_at IS NULL
              AND rolled_back_at IS NULL
          ")"
          if [ "$applied" != "$expected" ] || [ "$unfinished" != "0" ]; then
            echo "::error::Prisma ledger verification failed: expected=$expected applied=$applied unfinished=$unfinished."
            exit 1
          fi
          echo "Verified $applied applied migrations; no unfinished migrations. A historical rolled-back row does not fail this check: a recovered migration is re-applied as a separate row."
