name: Redeploy staging after auth environment repair

on:
  push:
    branches:
      - staging
    paths:
      - ".github/workflows/redeploy-staging-auth.yml"

permissions:
  contents: read

concurrency:
  group: redeploy-staging-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: billykshowalters
      BACKEND_DEPLOYMENT: https://tradeos-costbook-mong8jtyi-billykshowalters.vercel.app
      WEB_DEPLOYMENT: https://tradeos-costbook-5io494luj-billykshowalters.vercel.app
    steps:
      - name: Require Vercel token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::GitHub secret VERCEL_TOKEN is missing."; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.2

      - name: Redeploy staging backend
        run: vercel redeploy "$BACKEND_DEPLOYMENT" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Redeploy staging frontend
        run: vercel redeploy "$WEB_DEPLOYMENT" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
