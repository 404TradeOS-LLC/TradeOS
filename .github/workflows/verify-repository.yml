name: Verify repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint, unit tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://tradeos_ci:tradeos_ci@127.0.0.1:5432/tradeos_ci?schema=public
        run: npx prisma validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Athena kernel contracts
        run: npm run athena:contracts

      - name: Athena kernel smoke
        run: npm run athena:smoke

      - name: Build
        run: npm run build

      - name: Verify tracked source remains clean
        working-directory: .
        run: git diff --check && git diff --exit-code

  app-integration:
    name: App integration tests
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Integration and migration rehearsal
        run: npm run test:integration

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint .

      - name: Build
        run: npm run build

      - name: Verify tracked source remains clean
        working-directory: .
        run: git diff --check && git diff --exit-code
