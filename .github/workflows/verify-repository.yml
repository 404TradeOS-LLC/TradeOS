name: Verify repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect verification scope
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed surfaces
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          app=true
          web=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git diff --quiet "origin/$BASE_REF...HEAD" -- app/ packages/knowledge-engine/; then app=false; fi
            if git diff --quiet "origin/$BASE_REF...HEAD" -- web/; then web=false; fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "app=$app web=$web"

  app-typecheck:
    name: App typecheck
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://tradeos_ci:tradeos_ci@127.0.0.1:5432/tradeos_ci?schema=public
        run: npx prisma validate
      - run: npm run lint

  app-unit:
    name: App unit tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  app-athena:
    name: Athena contracts and smoke
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run athena:contracts
      - run: npm run athena:smoke

  app-build:
    name: App build and dependency audit
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Verify tracked source remains clean
        working-directory: .
        run: git diff --check && git diff --exit-code

  app-integration:
    name: App integration tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npm ci
      - name: Integration and migration rehearsal
        run: npm run test:integration

  app:
    name: App lint, unit tests, and build
    needs: [changes, app-typecheck, app-unit, app-athena, app-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve legacy required-check context
        env:
          APP_SCOPE: ${{ needs.changes.outputs.app }}
          TYPECHECK_RESULT: ${{ needs.app-typecheck.result }}
          UNIT_RESULT: ${{ needs.app-unit.result }}
          ATHENA_RESULT: ${{ needs.app-athena.result }}
          BUILD_RESULT: ${{ needs.app-build.result }}
        run: |
          set -euo pipefail
          if [ "$APP_SCOPE" != "true" ]; then
            echo "No app or Knowledge Engine changes."
            exit 0
          fi
          for result in "$TYPECHECK_RESULT" "$UNIT_RESULT" "$ATHENA_RESULT" "$BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::App verification child job result: $result"
              exit 1
            fi
          done

  web-test:
    name: Web unit tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  web-lint:
    name: Web lint
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint .

  web-build:
    name: Web build and dependency audit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Verify tracked source remains clean
        working-directory: .
        run: git diff --check && git diff --exit-code

  web:
    name: Web lint and build
    needs: [changes, web-test, web-lint, web-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Preserve legacy required-check context
        env:
          WEB_SCOPE: ${{ needs.changes.outputs.web }}
          TEST_RESULT: ${{ needs.web-test.result }}
          LINT_RESULT: ${{ needs.web-lint.result }}
          BUILD_RESULT: ${{ needs.web-build.result }}
        run: |
          set -euo pipefail
          if [ "$WEB_SCOPE" != "true" ]; then
            echo "No web changes."
            exit 0
          fi
          for result in "$TEST_RESULT" "$LINT_RESULT" "$BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::Web verification child job result: $result"
              exit 1
            fi
          done
