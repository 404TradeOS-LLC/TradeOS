name: Verify repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint, unit tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect app verification scope
        id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/$BASE_REF...HEAD" -- app/ packages/knowledge-engine/; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No app or Knowledge Engine changes; app verification lane will succeed without expensive setup."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Validate Prisma schema
        if: steps.scope.outputs.run == 'true'
        env:
          DATABASE_URL: postgresql://tradeos_ci:tradeos_ci@127.0.0.1:5432/tradeos_ci?schema=public
        run: npx prisma validate

      - name: Audit production dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        if: steps.scope.outputs.run == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: npm test

      - name: Athena kernel contracts
        if: steps.scope.outputs.run == 'true'
        run: npm run athena:contracts

      - name: Athena kernel smoke
        if: steps.scope.outputs.run == 'true'
        run: npm run athena:smoke

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Verify tracked source remains clean
        if: steps.scope.outputs.run == 'true'
        working-directory: .
        run: git diff --check && git diff --exit-code

  app-integration:
    name: App integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect app integration scope
        id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/$BASE_REF...HEAD" -- app/ packages/knowledge-engine/; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No app or Knowledge Engine changes; integration lane will succeed without expensive setup."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install psql client
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Integration and migration rehearsal
        if: steps.scope.outputs.run == 'true'
        run: npm run test:integration

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect web verification scope
        id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/$BASE_REF...HEAD" -- web/; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No web changes; web verification lane will succeed without expensive setup."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Audit production dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: npm test

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint .

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Verify tracked source remains clean
        if: steps.scope.outputs.run == 'true'
        working-directory: .
        run: git diff --check && git diff --exit-code
