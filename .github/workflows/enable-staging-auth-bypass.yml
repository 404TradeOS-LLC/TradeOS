name: Enable staging auth bypass environment

on:
  push:
    branches:
      - staging
    paths:
      - ".github/workflows/enable-staging-auth-bypass.yml"

permissions:
  contents: read

concurrency:
  group: enable-staging-auth-bypass
  cancel-in-progress: false

jobs:
  configure:
    name: Configure staging-only auth bypass
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_nY1VrcaEYEr4rcW7Gxweq7LP
      WEB_PROJECT_ID: prj_jDyORkIa7ug3ZtgtNujwEa65hQ36
      API_PROJECT_ID: prj_BVJxF6rnO90wMdNjZ1Yn4QO1aGwD
      STAGING_BRANCH: staging
    steps:
      - name: Require configured Vercel token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::GitHub secret VERCEL_TOKEN is missing."; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.2

      - name: Verify Vercel token
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Enable bypass on staging Preview only
        shell: bash
        run: |
          set -euo pipefail
          for project in "$WEB_PROJECT_ID" "$API_PROJECT_ID"; do
            if VERCEL_ORG_ID="$VERCEL_TEAM_ID" VERCEL_PROJECT_ID="$project"               vercel env update TRADEOS_AUTH_BYPASS preview "$STAGING_BRANCH"               --value true --yes --token="$VERCEL_TOKEN"; then
              continue
            fi
            printf '%s' true | VERCEL_ORG_ID="$VERCEL_TEAM_ID" VERCEL_PROJECT_ID="$project"               vercel env add TRADEOS_AUTH_BYPASS preview "$STAGING_BRANCH" --token="$VERCEL_TOKEN"
          done
