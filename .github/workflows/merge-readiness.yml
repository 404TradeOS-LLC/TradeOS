name: Merge readiness

on:
  workflow_run:
    workflows:
      - Verify repository
      - Docs consistency
      - Workflow security
      - Migration safety
      - Sprint governance
      - Live documentation reconciliation
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: merge-readiness-${{ github.event.workflow_run.head_sha || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  summarize:
    name: Merge readiness summary
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pr="$DISPATCH_PR"
          else
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "$RUN_HEAD_SHA" --json number,headRefOid --jq '.[] | select(.headRefOid == env.RUN_HEAD_SHA) | .number' | head -n1)"
          fi
          if [ -z "${pr:-}" ]; then
            echo "No open PR maps to this workflow run; nothing to summarize."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Evaluate merge state and checks
        if: steps.pr.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,mergeStateStatus,reviewDecision,statusCheckRollup,url,headRefName,baseRefName)"
          echo "$json" > "$RUNNER_TEMP/pr.json"
          url="$(jq -r '.url' "$RUNNER_TEMP/pr.json")"
          draft="$(jq -r '.isDraft' "$RUNNER_TEMP/pr.json")"
          merge_state="$(jq -r '.mergeStateStatus' "$RUNNER_TEMP/pr.json")"
          review="$(jq -r '.reviewDecision // "NONE"' "$RUNNER_TEMP/pr.json")"

          {
            echo "## Merge readiness for PR #$PR_NUMBER"
            echo
            echo "- URL: $url"
            echo "- Draft: $draft"
            echo "- Merge state: $merge_state"
            echo "- Review decision: $review"
            echo
            echo "### Checks"
            jq -r '.statusCheckRollup[]? | "- \(.name // .context // "unnamed"): \(.conclusion // .state // .status // "UNKNOWN")"' "$RUNNER_TEMP/pr.json"
          } >> "$GITHUB_STEP_SUMMARY"

          failed="$(jq '[.statusCheckRollup[]? | select((.conclusion // "") | test("FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED"))] | length' "$RUNNER_TEMP/pr.json")"
          pending="$(jq '[.statusCheckRollup[]? | select(((.conclusion // "") == "") and ((.state // .status // "") | test("PENDING|QUEUED|IN_PROGRESS|EXPECTED")))] | length' "$RUNNER_TEMP/pr.json")"

          if [ "$draft" = "true" ]; then
            echo "::error::PR is still draft."
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed required/reported checks are failing."
            exit 1
          fi
          if [ "$pending" -gt 0 ]; then
            echo "::error::$pending checks are still pending."
            exit 1
          fi
          case "$merge_state" in
            CLEAN|HAS_HOOKS|UNSTABLE) ;;
            *)
              echo "::error::Merge state is $merge_state."
              exit 1
              ;;
          esac
          echo "PR #$PR_NUMBER is merge-ready from GitHub's current evidence."
