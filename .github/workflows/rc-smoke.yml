name: Release candidate authenticated smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: TradeOS web base URL
        required: true
        type: string
      routes:
        description: Comma-separated authenticated routes
        required: true
        default: /dashboard,/customers,/projects,/estimates,/proposals,/contracts,/jobs,/invoices,/costbook
        type: string

permissions:
  contents: read

concurrency:
  group: rc-authenticated-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Authenticated RC route smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      RC_BASE_URL: ${{ inputs.base_url }}
      RC_ROUTES: ${{ inputs.routes }}
      RC_STORAGE_STATE_B64: ${{ secrets.RC_E2E_STORAGE_STATE_B64 }}
      RC_STORAGE_STATE_PATH: /tmp/rc-storage-state.json
      RC_EVIDENCE_DIR: ../artifacts/rc-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Require authenticated storage state
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RC_STORAGE_STATE_B64" ]; then
            echo "::error::Repository secret RC_E2E_STORAGE_STATE_B64 is required."
            exit 1
          fi
          printf '%s' "$RC_STORAGE_STATE_B64" | base64 --decode > "$RC_STORAGE_STATE_PATH"
          chmod 600 "$RC_STORAGE_STATE_PATH"
      - run: npx playwright install --with-deps chromium
      - run: node scripts/authenticated-route-smoke.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: rc-authenticated-smoke
          path: artifacts/rc-smoke
          if-no-files-found: error
          retention-days: 30
