name: S053 Preview env diagnostic

on:
  push:
    branches:
      - evidence/s053-auth-browser-6271713

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_nY1VrcaEYEr4rcW7Gxweq7LP
      PROJECT_ID: prj_jDyORkIa7ug3ZtgtNujwEa65hQ36
      TARGET_BRANCH: feature/athena-contractor-estimating-copilot
    steps:
      - name: Inspect Preview env metadata without values
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const team = process.env.TEAM_ID;
          const project = process.env.PROJECT_ID;
          const branch = process.env.TARGET_BRANCH;
          async function inspect(label, suffix) {
            const url = new URL(`https://api.vercel.com/v10/projects/${project}/env`);
            url.searchParams.set('teamId', team);
            if (suffix) url.searchParams.set('gitBranch', suffix);
            const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            if (!res.ok) throw new Error(`${label} env lookup failed: ${res.status}`);
            const payload = await res.json();
            const rows = payload.envs ?? payload;
            const summary = rows
              .filter((row) => ['NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY','BACKEND_API_URL','SUPABASE_SERVICE_ROLE_KEY','NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET','SUPABASE_STORAGE_BUCKET_PUBLIC'].includes(row.key))
              .map(({id,key,target,gitBranch,createdAt,updatedAt,type}) => ({id,key,target,gitBranch:gitBranch ?? null,createdAt,updatedAt,type}));
            console.log(label + ': ' + JSON.stringify(summary));
          }
          await inspect('all-env', null);
          await inspect('branch-env', branch);

          const allUrl = new URL(`https://api.vercel.com/v10/projects/${project}/env`);
          allUrl.searchParams.set('teamId', team);
          const allRes = await fetch(allUrl, { headers: { Authorization: `Bearer ${token}` } });
          if (!allRes.ok) throw new Error(`env metadata lookup failed: ${allRes.status}`);
          const allPayload = await allRes.json();
          const rows = allPayload.envs ?? allPayload;
          const backendCandidates = rows.filter((row) =>
            row.key === 'BACKEND_API_URL' &&
            (Array.isArray(row.target) ? row.target.includes('preview') : row.target === 'preview') &&
            !row.gitBranch
          );
          const backendMeta = [...backendCandidates].sort((a,b) => Number(b.updatedAt ?? b.createdAt ?? 0) - Number(a.updatedAt ?? a.createdAt ?? 0))[0];
          if (!backendMeta?.id) throw new Error('shared Preview BACKEND_API_URL metadata missing');
          const valueUrl = new URL(`https://api.vercel.com/v1/projects/${project}/env/${backendMeta.id}`);
          valueUrl.searchParams.set('teamId', team);
          const valueRes = await fetch(valueUrl, { headers: { Authorization: `Bearer ${token}` } });
          if (!valueRes.ok) throw new Error(`backend env value lookup failed: ${valueRes.status}`);
          const valuePayload = await valueRes.json();
          const backend = new URL(valuePayload.value);
          const expected = 'tradeos-costbook-git-staging-billykshowalters.vercel.app';
          const production = new Set(['api.404tradeos.com']);
          const classification = backend.hostname === expected ? 'expected-staging-alias' : production.has(backend.hostname) ? 'PRODUCTION' : backend.hostname.endsWith('.vercel.app') ? 'other-vercel-preview' : 'other';
          console.log('backend-classification: ' + classification);
          if (classification === 'PRODUCTION') throw new Error('Preview BACKEND_API_URL points at Production');
          for (const probe of [
            { method:'GET', path:'/health' },
            { method:'GET', path:'/ready' },
            { method:'POST', path:'/api/v1/auth/bootstrap' },
          ]) {
            const res = await fetch(new URL(probe.path, backend), {
              method: probe.method,
              redirect: 'manual',
              headers: { 'content-type': 'application/json', 'user-agent': 'TradeOS-S053-env-diagnostic/1.0' },
              ...(probe.method === 'POST' ? { body: '{}' } : {}),
            });
            console.log(`backend-probe ${probe.method} ${probe.path}: ${res.status}`);
          }
          NODE
