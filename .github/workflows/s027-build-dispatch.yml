name: S027 one-time build and evidence dispatch

on:
  push:
    branches:
      - test/s027-browser-completion
    paths:
      - .github/workflows/s027-build-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_API_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_nY1VrcaEYEr4rcW7Gxweq7LP
      VERCEL_PROJECT_ID: prj_jDyORkIa7ug3ZtgtNujwEa65hQ36
      BASE_URL: ""
      BRANCH: test/s027-browser-completion
      ORG_LABEL: TradeOS Beta Smoke
      ORG_ID: 9814bd72-626a-42f4-8871-cd755cb9d685
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh frontend Preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx --yes vercel@latest deploy --force --non-interactive --yes \
            --token="${VERCEL_TOKEN}" --scope="${VERCEL_ORG_ID}" \
            --meta githubCommitRef="${BRANCH}" \
            --meta githubCommitSha="${GITHUB_SHA}" 2>&1 | tee /tmp/vercel-deploy.log)"
          deployment_url="$(printf '%s\n' "${output}" | grep -Eo 'https://[[:alnum:]._~-]+\.vercel\.app' | tail -n 1)"
          [ -n "${deployment_url}" ] || { echo "::error::Could not determine Vercel deployment URL."; exit 1; }
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Fresh Preview deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Wait for Preview
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          status=""
          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "${deployment_url}/login" || true)"
            echo "Preview HTTP status: ${status}"
            if [ "${status}" = "200" ] || [ "${status}" = "302" ]; then break; fi
            sleep 5
          done
          case "${status}" in 200|302) ;; *) echo "::error::Preview did not become reachable."; exit 1;; esac
      - name: Dispatch S027 evidence with sanitized tenant confirmation
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.deploy.outputs.deployment_url }}"
          payload="$(jq -n \
            --arg ref "${BRANCH}" --arg base_url "${base_url}" --arg expected_sha "${GITHUB_SHA}" \
            --arg label "${ORG_LABEL}" --arg org_id "${ORG_ID}" \
            '{ref:$ref,inputs:{base_url:$base_url,expected_sha:$expected_sha,smoke_tenant_label:$label,smoke_org_id:$org_id,sanitized_tenant:"true"}}')"
          code="$(curl --silent --show-error --max-time 30 -o /tmp/dispatch-response -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/404TradeOS-LLC/TradeOS/actions/workflows/s027-browser-evidence.yml/dispatches" \
            --data "${payload}")"
          [ "${code}" = "204" ] || { cat /tmp/dispatch-response; exit 1; }
          echo "Evidence workflow dispatched for ${base_url}."
