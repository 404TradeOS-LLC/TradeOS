name: Temporary Beta Docs Sync

on:
  push:
    branches:
      - fix/beta-evidence-rc-regressions

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Update required source-of-truth docs and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          domain_path = Path('docs/DOMAIN_MODEL.md')
          domain = domain_path.read_text()
          domain = domain.replace('last_verified: 2026-08-31', 'last_verified: 2026-09-05', 1)
          related_old = '  - app/prisma/schema.prisma\n'
          related_new = '  - app/prisma/schema.prisma\n  - app/prisma/migrations/20260905050000_allow_custom_estimate_line_items\n'
          if related_new not in domain:
              if related_old not in domain:
                  raise SystemExit('DOMAIN_MODEL related_code anchor not found')
              domain = domain.replace(related_old, related_new, 1)
          estimate_old = '- owns estimate line items\n- may feed proposals and invoices\n'
          estimate_new = '- owns estimate line items\n- estimate line items may reference zero or one Costbook source (`costItemId` or `assemblyId`): zero is a valid custom line item, while referencing both sources simultaneously is prohibited by the database constraint\n- may feed proposals and invoices\n'
          if estimate_new not in domain:
              if estimate_old not in domain:
                  raise SystemExit('DOMAIN_MODEL Estimate anchor not found')
              domain = domain.replace(estimate_old, estimate_new, 1)
          domain_path.write_text(domain)

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text()
          marker = '## RC beta evidence validation — 2026-09-05'
          if marker not in state:
              state = state.rstrip() + f'''\n\n{marker}\n\n- Beta Evidence run `33945411532` completed successfully against the approved non-production RC preview with deployment SHA correlation to `ee2300a438311e50f6813510578c125073a1f850`. Authentication, tenant isolation, 1440/1024/768/390 browser captures, downstream contractor workflow, artifact validation, and credential scanning all passed.\n- The validated contractor path creates a customer and project, builds and finalizes an estimate, transfers the exact customer-facing price into a proposal, sends and accepts it, creates a contract, and creates an invoice with the accepted `$7,105.07` total.\n- RC defects repaired for promotion are browser API proxy path normalization, proposal cents preservation, invoice Decimal-to-number display normalization, and mobile `PageHeader` wrapping that removes 390px horizontal overflow.\n- Custom estimate line items are valid without a Costbook source. Migration `20260905050000_allow_custom_estimate_line_items` changes the database invariant from exactly-one-source to at-most-one-source, preserving mutual exclusivity while allowing source-less custom lines.\n- Tenant-isolation evidence now asserts denial at the authenticated same-origin API proxy/backend boundary (403/404 required) and treats the browser page as a secondary UX signal, avoiding false failures from Next.js error boundaries that can retain an outer HTTP 200 after a denied server-component fetch.\n'''
          state_path.write_text(state)
          PY
          rm -f .github/workflows/temporary-beta-doc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: record validated RC beta evidence and line-item invariant"
          git push origin HEAD:fix/beta-evidence-rc-regressions
