name: Temporary regenerate Prisma lock

on:
  push:
    branches:
      - dependabot/npm_and_yarn/app/prisma-stack-70d358c6e9
    paths:
      - app/package.json
      - .github/workflows/tmp-regenerate-prisma-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    name: Regenerate app package lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Regenerate lockfile
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- app/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          git commit -m "fix(deps): regenerate Prisma lock with secure override"
          git push origin HEAD:${GITHUB_REF_NAME}
