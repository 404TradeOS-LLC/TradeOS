name: S027 authenticated browser evidence

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Authenticated TradeOS web base URL
        required: true
        type: string
      expected_sha:
        description: Full deployed commit SHA verified through Vercel metadata
        required: true
        type: string
      smoke_tenant_label:
        description: Sanitized smoke organization name
        required: true
        default: TradeOS Beta Smoke
        type: string
      sanitized_tenant:
        description: Confirm test-only tenant and equipment fixture create/edit/delete
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tradeos-beta-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Costbook evidence 1440/1024/768/390
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    env:
      S027_BASE_URL: ${{ inputs.base_url }}
      S027_EXPECTED_SHA: ${{ inputs.expected_sha }}
      S027_SANITIZED_TENANT: ${{ inputs.sanitized_tenant }}
      S027_ALLOW_MUTATIONS: ${{ inputs.sanitized_tenant }}
      S027_STORAGE_STATE_PATH: /tmp/s027-storage-state.json
      S027_EVIDENCE_DIR: ../artifacts/s027-browser-evidence
      BETA_RC_BASE_URL_RESOLVED: ${{ inputs.base_url }}
      BETA_SMOKE_EMAIL: ${{ secrets.BETA_RC_SMOKE_EMAIL }}
      BETA_SMOKE_PASSWORD: ${{ secrets.BETA_RC_SMOKE_PASSWORD }}
      BETA_SMOKE_ORG_LABEL: ${{ inputs.smoke_tenant_label }}
      BETA_RC_SUPABASE_PROJECT_REF: ${{ secrets.BETA_RC_SUPABASE_PROJECT_REF }}
      BETA_STORAGE_STATE_PATH: /tmp/s027-storage-state.json
      BETA_EVIDENCE_DIR: ../artifacts/s027-browser-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node --test scripts/s027-evidence-contract.test.mjs
      - name: Verify preview deployment identity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/s027-deployment-identity.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticate dedicated smoke tenant
        run: node scripts/beta-evidence/auth-setup.mjs
      - name: Capture authenticated responsive evidence
        run: node scripts/s027-browser-evidence.mjs
      - name: Verify deployment did not change during capture
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/s027-deployment-identity.mjs --verify
      - name: Remove runtime storage state
        if: always()
        run: rm -f "$S027_STORAGE_STATE_PATH"
      - name: Scan artifact for credential material
        id: credential_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bundle="../artifacts/s027-browser-evidence"
          [ -d "$bundle" ] || exit 1
          if grep -rlIE '"cookies"[[:space:]]*:|sb-[a-z0-9-]+-auth-token|tradeos_(access|refresh)_token|Bearer [A-Za-z0-9._-]{20,}' "$bundle" >/dev/null 2>&1; then
            echo "::error::Credential material detected; refusing artifact upload."
            exit 1
          fi
      - name: Upload evidence artifact
        if: ${{ always() && steps.credential_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: s027-browser-evidence
          path: artifacts/s027-browser-evidence
          if-no-files-found: error
          retention-days: 30
