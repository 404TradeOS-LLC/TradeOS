name: Sprint governance

on:
  pull_request:
    paths:
      - "docs/SPRINT_BACKLOG.md"
      - "docs/SESSION_HANDOFF.md"
      - "docs/CURRENT_STATE.md"
      - "docs/ENGINEERING_COMMAND_CENTER.md"
      - "scripts/sprint-state-check.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sprint-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sprint-state:
    name: Sprint state validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate sprint dependency/state invariants
        run: node scripts/sprint-state-check.mjs
      - name: Run repository docs governance
        run: npm run docs:test
      - name: Run PR preflight tests
        run: npm run pr:test
      - name: Validate docs ownership against base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npm run docs:check -- --base "$BASE_REF"

  readiness-scope:
    name: Sprint readiness/completion scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard governance-only readiness promotions
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          if ! git diff --quiet "$base...HEAD" -- docs/SPRINT_BACKLOG.md; then
            added_ready="$(git diff -U0 "$base...HEAD" -- docs/SPRINT_BACKLOG.md | grep -c '^+Status: READY$' || true)"
            removed_planned="$(git diff -U0 "$base...HEAD" -- docs/SPRINT_BACKLOG.md | grep -c '^-Status: PLANNED$' || true)"
            if [ "$added_ready" -gt 0 ] || [ "$removed_planned" -gt 0 ]; then
              unexpected="$(git diff --name-only "$base...HEAD" | grep -Ev '^(docs/|scripts/|package(-lock)?\.json$|\.github/workflows/sprint-governance\.yml$)' || true)"
              if [ -n "$unexpected" ]; then
                echo "::error::Readiness promotion PR also changes implementation paths:"
                echo "$unexpected"
                exit 1
              fi
            fi
          fi

  merged-evidence:
    name: DONE sprint merge evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify new DONE evidence points to merged PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          changed="$(git diff -U6 "$base...HEAD" -- docs/SPRINT_BACKLOG.md || true)"
          mapfile -t prs < <(printf '%s\n' "$changed" | awk '
            /^\+Status: DONE$/ {done=1; next}
            done && /^\+Evidence:/ {
              if (match($0, /PR #[0-9]+/)) {
                value=substr($0, RSTART+4, RLENGTH-4)
                print value
              }
              done=0
            }' | sort -u)
          for pr in "${prs[@]}"; do
            [ -n "$pr" ] || continue
            merged="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergedAt --jq '.mergedAt // ""')"
            if [ -z "$merged" ]; then
              echo "::error::Sprint DONE evidence references PR #$pr, but GitHub does not report it merged."
              exit 1
            fi
            echo "Verified merged evidence PR #$pr at $merged"
          done
