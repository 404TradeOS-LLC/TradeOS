name: Live documentation reconciliation

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/live-sprint-evidence-check.mjs"
      - "scripts/sprint-state-check.mjs"
      - ".github/workflows/docs-reconciliation.yml"
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Live sprint evidence and docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run docs:test
      - run: node scripts/sprint-state-check.mjs
      - name: Verify DONE evidence against live GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/live-sprint-evidence-check.mjs
      - name: Validate changed-doc ownership
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npm run docs:check -- --base "$BASE_REF"
