name: Preview smoke check

# Runs web/scripts/preview-smoke-check.mjs against a live Vercel Preview
# deployment (and, when available, the shared staging backend) to catch
# staging-isolation regressions early — see docs/DEPLOYMENT_GUIDE.md's
# "Environment architecture" section for the full picture.
#
# Two triggers, on purpose:
#
# 1. workflow_dispatch — always reliable. Run manually against any known
#    Preview URL, e.g. after opening a PR and copying its Vercel Preview
#    URL from the PR's Vercel bot comment or the Vercel dashboard.
#
# 2. deployment_status — best-effort automatic trigger, following Vercel's
#    own documented pattern for this exact use case
#    (https://vercel.com/docs/deployment-protection/automated-agent-access).
#    LIMITATION, stated plainly rather than guessed around: this repository
#    has no existing workflow that consumes Vercel deployment events, so
#    the exact values Vercel's GitHub integration sets for
#    `deployment.environment` have not been confirmed against a real event
#    in this repo. The filters below use the well-documented convention
#    ("Preview") plus a target_url substring check to select only the
#    frontend project's Preview deployments (this repo hosts two Vercel
#    projects — tradeos-costbook and tradeos-costbook-web — sharing one
#    GitHub repo, so deployment_status fires for both). If this filter
#    doesn't fire as expected on the first real PR, the workflow_dispatch
#    path above still works unconditionally — use it in the meantime
#    rather than loosening this filter blindly.

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Frontend Preview deployment URL (tradeos-costbook-web)"
        required: true
        type: string
      backend_url:
        description: "Backend URL to check (defaults to the shared staging backend)"
        required: false
        type: string
        default: "https://tradeos-costbook-git-staging-billykshowalters.vercel.app"
  deployment_status:

permissions:
  contents: read

jobs:
  smoke-check:
    name: Run preview smoke check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview' &&
       contains(github.event.deployment_status.target_url, 'tradeos-costbook-web'))
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run smoke check
        env:
          PREVIEW_URL: ${{ inputs.preview_url || github.event.deployment_status.target_url }}
          BACKEND_URL: ${{ inputs.backend_url || 'https://tradeos-costbook-git-staging-billykshowalters.vercel.app' }}
        working-directory: web
        run: node scripts/preview-smoke-check.mjs
