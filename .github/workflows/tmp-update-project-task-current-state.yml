name: Temporary update project task current state

on:
  push:
    branches:
      - fix/project-task-parent-scope
    paths:
      - .github/workflows/tmp-update-project-task-current-state.yml

permissions:
  contents: write

jobs:
  update-doc:
    name: Update CURRENT_STATE project task truth
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update project task implementation truth
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CURRENT_STATE.md')
          text = path.read_text()
          old = '- Project tasks\n'
          new = '- Project tasks: nested `PATCH`/`DELETE /api/v1/projects/:projectId/tasks/:taskId` mutations require the resolved task to belong to the route project, and task reassignment to a `jobId` requires that active job to belong to the same organization and project; mismatches are rejected before task or activity writes.\n'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Expected Project tasks bullet not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit current-state update
        run: |
          if git diff --quiet -- docs/CURRENT_STATE.md; then
            echo "CURRENT_STATE is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md
          git commit -m "docs: record project task parent-scope enforcement"
          git push origin HEAD:${GITHUB_REF_NAME}
