name: PR maintenance

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to rebase onto main
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: pr-maintenance-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  rebase:
    name: Rebase PR onto main
    runs-on: ubuntu-latest
    # GitHub's server-side PR rebase updates the selected branch and PR metadata;
    # keep write scopes on this one manual job instead of the whole workflow.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          # GitHub Actions can serialize a numeric workflow_dispatch input as
          # "961.0" instead of "961". Only accept a positive whole-number PR ID.
          # Validate before any gh command so malformed input is never treated
          # as a branch name or other ref.
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*(\.0+)?$ ]]; then
            echo "::error::pr_number must be a positive integer" >&2
            exit 1
          fi
          PR_NUMBER="${PR_NUMBER%%.*}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          base_ref="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)"
          head_repo="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRepository --jq .headRepository.nameWithOwner)"
          state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"

          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is not open."
            exit 1
          fi

          if [ "$base_ref" != "main" ]; then
            echo "PR #$PR_NUMBER targets '$base_ref', not 'main'."
            exit 1
          fi

          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR #$PR_NUMBER comes from '$head_repo'; fork PRs are not modified."
            exit 1
          fi

      - name: Rebase pull request branch onto main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: gh pr update-branch "$PR_NUMBER" --rebase --repo "$GITHUB_REPOSITORY"

      - name: Report updated head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,url,baseRefName,headRefName,headRefOid,mergeStateStatus \
            --jq '{number,url,base:.baseRefName,head:.headRefName,headSha:.headRefOid,mergeState:.mergeStateStatus}'
