name: S068 change-order browser evidence

# S068 staff change-order certification run. Drives the draft -> priced line
# item -> approve / reject journey plus the negative security matrix at
# 1440/1024/768/390 against an approved non-production deployment, with
# deployment identity proven before capture and a credential scan gating
# artifact upload.
#
# See docs/testing/S068_CHANGE_ORDER_EVIDENCE.md for the certification step
# list, bearer-material rules, and the blocked customer-decision step (P1,
# ADR-010). See docs/architecture/S068_CHANGE_ORDER_CUSTOMER_WORKFLOW_PLAN.md
# for the sprint plan. This workflow never dispatches itself and never
# touches production: the RC-target guards refuse production hosts, the
# Production alias, and -git-main- previews outright.
#
# Deployment identity reuses app/scripts/s059-deployment-identity.mjs
# (S059_* env names, pointed at this run's evidence dir): there is one
# proven identity script and no S068 copy of it. The S068 capture script
# reads the deployment-identity.json it writes.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Authenticated TradeOS web base URL
        required: true
        type: string
      expected_sha:
        description: Full deployed commit SHA verified through Vercel metadata and runtime /health
        required: true
        type: string
      smoke_tenant_label:
        description: Sanitized smoke organization name
        required: true
        default: TradeOS Beta Smoke
        type: string
      smoke_org_id:
        description: Canonical organization ID of the sanitized smoke tenant
        required: true
        type: string
      sanitized_tenant:
        description: Confirm test-only tenant and change-order fixture create
        required: true
        default: false
        type: boolean
      use_test_org:
        description: Use the existing TEST_STAGING credential pair for the pinned synthetic TEST Org (staging data plane only)
        required: false
        default: true
        type: boolean
      require_sha_correlation:
        description: Fail if the deployment SHA cannot be correlated with the expected SHA
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: tradeos-s068-browser-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Change-order evidence 1440/1024/768/390
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    env:
      S068_BASE_URL: ${{ inputs.base_url }}
      S068_EXPECTED_SHA: ${{ inputs.expected_sha }}
      S068_REQUIRE_SHA_CORRELATION: ${{ inputs.require_sha_correlation }}
      S068_SANITIZED_TENANT: ${{ inputs.sanitized_tenant }}
      S068_ALLOW_MUTATIONS: ${{ inputs.sanitized_tenant }}
      S068_USE_TEST_ORG: ${{ inputs.use_test_org }}
      S068_STORAGE_STATE_PATH: /tmp/s068-storage-state.json
      S068_EVIDENCE_DIR: ../artifacts/s068-browser-evidence
      S068_SMOKE_TENANT_LABEL: ${{ inputs.smoke_tenant_label }}
      BETA_RC_BASE_URL_RESOLVED: ${{ inputs.base_url }}
      # Explicit, mutually exclusive references avoid exposing the full secrets
      # context. Missing TEST values cannot fall through to another account.
      BETA_SMOKE_EMAIL: ${{ inputs.use_test_org && secrets.TEST_STAGING_EMAIL || !inputs.use_test_org && secrets.BETA_RC_SMOKE_EMAIL || '' }}
      BETA_SMOKE_PASSWORD: ${{ inputs.use_test_org && secrets.TEST_STAGING_PASSWORD || !inputs.use_test_org && secrets.BETA_RC_SMOKE_PASSWORD || '' }}
      BETA_SMOKE_ORG_LABEL: ${{ inputs.smoke_tenant_label }}
      BETA_SMOKE_ORG_ID: ${{ inputs.smoke_org_id }}
      BETA_RC_SUPABASE_PROJECT_REF: ${{ secrets.BETA_RC_SUPABASE_PROJECT_REF }}
      BETA_STORAGE_STATE_PATH: /tmp/s068-storage-state.json
      BETA_EVIDENCE_DIR: ../artifacts/s068-browser-evidence
      BETA_FOREIGN_CHANGE_ORDER_ID: ${{ secrets.BETA_RC_FOREIGN_CHANGE_ORDER_ID }}
      BETA_S068_WRONG_ROLE_EMAIL: ${{ secrets.BETA_RC_S068_WRONG_ROLE_EMAIL }}
      BETA_S068_WRONG_ROLE_PASSWORD: ${{ secrets.BETA_RC_S068_WRONG_ROLE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node --test scripts/s068-evidence-contract.test.mjs
      - name: Verify preview deployment identity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          S059_BASE_URL: ${{ inputs.base_url }}
          S059_EXPECTED_SHA: ${{ inputs.expected_sha }}
          S059_REQUIRE_SHA_CORRELATION: ${{ inputs.require_sha_correlation }}
          S059_SANITIZED_TENANT: ${{ inputs.sanitized_tenant }}
          S059_EVIDENCE_DIR: ../artifacts/s068-browser-evidence
        run: node scripts/s059-deployment-identity.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticate dedicated smoke tenant
        run: node scripts/beta-evidence/auth-setup.mjs
      - name: Capture change-order evidence
        run: node scripts/s068-browser-evidence.mjs
      - name: Verify deployment did not change during capture
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          S059_BASE_URL: ${{ inputs.base_url }}
          S059_EXPECTED_SHA: ${{ inputs.expected_sha }}
          S059_REQUIRE_SHA_CORRELATION: ${{ inputs.require_sha_correlation }}
          S059_SANITIZED_TENANT: ${{ inputs.sanitized_tenant }}
          S059_EVIDENCE_DIR: ../artifacts/s068-browser-evidence
        run: node scripts/s059-deployment-identity.mjs --verify
      - name: Remove runtime storage state
        if: always()
        run: rm -f "$S068_STORAGE_STATE_PATH"
      - name: Scan artifact for credential material
        id: credential_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bundle="../artifacts/s068-browser-evidence"
          [ -d "$bundle" ] || exit 1
          if grep -rlIE '"cookies"[[:space:]]*:|sb-[a-z0-9-]+-auth-token|tradeos_(access|refresh)_token|Bearer [A-Za-z0-9._-]{20,}' "$bundle" >/dev/null 2>&1; then
            echo "::error::Credential material detected; refusing artifact upload."
            exit 1
          fi
      - name: Upload evidence artifact
        if: ${{ always() && steps.credential_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: s068-browser-evidence
          path: artifacts/s068-browser-evidence
          if-no-files-found: error
          retention-days: 30
