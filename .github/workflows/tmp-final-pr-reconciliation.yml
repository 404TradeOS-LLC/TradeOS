name: Temporary final PR reconciliation

on:
  push:
    branches:
      - docs/reconcile-live-pr-state
    paths:
      - .github/workflows/tmp-final-pr-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile-docs:
    name: Reconcile final open PR state
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reconcile source-of-truth docs
        run: python -c 'import base64; exec(base64.b64decode(""))'

      - name: Commit reconciled docs
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ENGINEERING_COMMAND_CENTER.md docs/SESSION_HANDOFF.md docs/SPRINT_BACKLOG.md docs/TRADEOS_BIBLE.md
          git commit -m "docs: reconcile final live PR state"
          git push origin HEAD:${GITHUB_REF_NAME}
