name: One-time Athena context interaction fix

on:
  push:
    branches:
      - fix/athena-context-interaction-propagation
    paths:
      - .github/workflows/one-time-athena-context-interaction-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/athena-context-interaction-propagation
          fetch-depth: 0
      - name: Propagate interaction to providers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/modules/athena-context-engine/assembler.ts')
          text = path.read_text()
          old = '''            actor: request.actor,\n            selectedScope: request.selectedScope,\n            deadline,\n'''
          new = '''            actor: request.actor,\n            selectedScope: request.selectedScope,\n            interaction: request.interaction,\n            deadline,\n'''
          if old not in text:
              raise SystemExit('target provider input block not found')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-athena-context-interaction-fix.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/modules/athena-context-engine/assembler.ts .github/workflows/one-time-athena-context-interaction-fix.yml
          git commit -m "fix(athena): propagate context interaction metadata"
          git push origin HEAD:fix/athena-context-interaction-propagation
