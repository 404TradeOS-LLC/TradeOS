name: Playwright Agent Chromium Evidence

# Manual, diagnostic browser evidence for the root Playwright agent suite.
# This is not a release-certification workflow and does not replace Beta Evidence.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Approved non-production TradeOS web origin; blank uses BETA_RC_BASE_URL
        required: false
        type: string
      target_environment:
        description: Non-production environment identity for the target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - staging
      sanitized_tenant:
        description: Confirm the target contains only sanitized test data
        required: true
        default: false
        type: boolean
      authenticated_smoke:
        description: Authenticate the governed smoke identity and run read-only contractor lifecycle checks
        required: true
        default: true
        type: boolean
      smoke_tenant_label:
        description: Sanitized smoke organization label expected after login; use the TEST Org's actual name when use_test_org is enabled
        required: true
        default: TradeOS Beta Smoke
        type: string
      estimate_stage_path:
        description: Relative draft estimate route for the estimate stage specs; blank skips them
        required: false
        type: string
      spec_file:
        description: Single Playwright spec file to run; blank runs the whole agent suite
        required: false
        type: string
      use_test_org:
        description: Authenticate the TEST Org staging test account (TEST_STAGING_EMAIL/PASSWORD) instead of the Beta Smoke identity
        required: false
        default: false
        type: boolean
      smoke_org_id:
        description: Canonical smoke organization UUID; when set, tenant verification uses the read-only Costbook workspace endpoint instead of loading Settings (which may persist a BrandProfile for legacy-branding tenants)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: playwright-agent-chromium-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Chromium browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TRADEOS_AGENT_ENVIRONMENT: ${{ inputs.target_environment }}
      TRADEOS_AGENT_SANITIZED_TENANT: ${{ inputs.sanitized_tenant }}
      TRADEOS_AGENT_EVIDENCE: "true"
      TRADEOS_AGENT_AUTHENTICATED: ${{ inputs.authenticated_smoke }}
      TRADEOS_ESTIMATE_STAGE_PATH: ${{ inputs.estimate_stage_path }}
      BETA_EVIDENCE_DIR: artifacts/playwright-agent-evidence/auth
      BETA_SMOKE_ORG_LABEL: ${{ inputs.smoke_tenant_label }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate spec_file resolves to one exact spec
        if: inputs.spec_file != ''
        env:
          SPEC_FILE: ${{ inputs.spec_file }}
        run: |
          set -eu
          # spec_file reaches Playwright as a positional argument, which
          # Playwright treats as a filter: a substring would silently match
          # several specs (or none). Require one exact checked-in spec file
          # under tests/playwright so the run covers exactly what was asked.
          if [ ! -f "${SPEC_FILE}" ]; then
            echo "::error::spec_file must name one checked-in Playwright spec file; '${SPEC_FILE}' does not exist."
            exit 1
          fi
          case "${SPEC_FILE}" in
            tests/playwright/*.spec.ts) ;;
            *)
              echo "::error::spec_file must be a Playwright spec under tests/playwright/; got '${SPEC_FILE}'."
              exit 1
              ;;
          esac

      - name: Reject targeted estimate runs without a draft route
        if: inputs.spec_file != ''
        env:
          SPEC_FILE: ${{ inputs.spec_file }}
          ESTIMATE_STAGE_PATH: ${{ inputs.estimate_stage_path }}
        run: |
          set -eu
          # The estimate specs read TRADEOS_ESTIMATE_STAGE_PATH and skip
          # every test when it is blank, so a targeted estimate run without
          # a route would report green while proving nothing. Fail fast.
          # Every estimate spec carries that skip guard, so the pattern
          # covers all of them (and any future estimate spec).
          case "${SPEC_FILE}" in
            *estimate-*.spec.ts)
              if [ -z "${ESTIMATE_STAGE_PATH}" ]; then
                echo "::error::spec_file selects an estimate spec ('${SPEC_FILE}') but estimate_stage_path is blank; targeted estimate evidence requires a draft estimate route."
                exit 1
              fi
              ;;
          esac

      - name: Reject unauthenticated estimate evidence
        shell: bash
        run: |
          set -euo pipefail
          # The estimate specs need a session: without one they land on the
          # login page and report a misleading navigation failure. Fail fast
          # instead of running them unauthenticated.
          if [ "${TRADEOS_AGENT_AUTHENTICATED}" != "true" ] && [ -n "${TRADEOS_ESTIMATE_STAGE_PATH}" ]; then
            echo "::error::estimate_stage_path requires authenticated_smoke: the estimate specs need an authenticated session."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root test dependencies
        run: npm ci

      - name: Resolve approved hosted target
        shell: bash
        env:
          REQUESTED_BASE_URL: ${{ inputs.base_url }}
          DEFAULT_BASE_URL: ${{ vars.BETA_RC_BASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { resolveAgentTarget } from "./tests/playwright/target.mjs";

          const candidate =
            (process.env.REQUESTED_BASE_URL || "").trim() ||
            (process.env.DEFAULT_BASE_URL || "").trim();

          if (!candidate) {
            throw new Error("Provide base_url or configure the BETA_RC_BASE_URL repository variable.");
          }

          const target = resolveAgentTarget({
            ...process.env,
            TRADEOS_AGENT_BASE_URL: candidate,
          });
          const url = new URL(target);

          if (url.protocol !== "https:" || !url.hostname.endsWith(".vercel.app")) {
            throw new Error("GitHub-hosted evidence requires an approved HTTPS TradeOS Preview/Staging origin.");
          }

          const storageStatePath = `${process.env.RUNNER_TEMP}/playwright-agent-storage-state.json`;
          // The estimate specs apply TRADEOS_ESTIMATE_STAGE_STATE as a
          // storageState path; exporting it before authentication would hand
          // them a file that does not exist yet and Playwright would fail
          // before creating a page. Export it only for authenticated runs —
          // a failed bootstrap aborts the job before the specs run, so the
          // file exists whenever the specs consume it.
          const estimateStateLine =
            process.env.TRADEOS_AGENT_AUTHENTICATED === "true"
              ? [`TRADEOS_ESTIMATE_STAGE_STATE=${storageStatePath}`]
              : [];
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `TRADEOS_AGENT_BASE_URL=${target}`,
              `BETA_RC_BASE_URL_RESOLVED=${target}`,
              `TRADEOS_AGENT_STORAGE_STATE=${storageStatePath}`,
              ...estimateStateLine,
              `BETA_STORAGE_STATE_PATH=${storageStatePath}`,
              "",
            ].join("\n"),
          );
          fs.mkdirSync("artifacts/playwright-agent-evidence", { recursive: true });
          fs.writeFileSync(
            "artifacts/playwright-agent-evidence/run.json",
            JSON.stringify(
              {
                workflowSha: process.env.GITHUB_SHA,
                target,
                environment: process.env.TRADEOS_AGENT_ENVIRONMENT,
                sanitizedTenant: process.env.TRADEOS_AGENT_SANITIZED_TENANT === "true",
                exactDeploymentShaCorrelated: false,
              },
              null,
              2,
            ) + "\n",
          );
          NODE

      - name: Validate target guardrails
        run: npm run test:e2e:guards

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Select read-only tenant verification when an org id is supplied
        if: inputs.authenticated_smoke && inputs.smoke_org_id != ''
        shell: bash
        run: |
          # The Settings tenant assertion may persist a BrandProfile for
          # legacy-branding tenants (lazy adoption in getSettings), so when
          # the operator supplies the canonical org UUID, verify through the
          # genuinely read-only Costbook workspace endpoint instead. The
          # smoke identities are owner-level, matching the assembly lane's
          # costbook_read_only owner step (expected write "true").
          echo "BETA_SMOKE_TENANT_VERIFY_MODE=costbook_read_only" >> "$GITHUB_ENV"
          echo "BETA_SMOKE_EXPECTED_COSTBOOK_WRITE=true" >> "$GITHUB_ENV"

      - name: Require authenticated smoke prerequisites
        if: inputs.authenticated_smoke && !inputs.use_test_org
        shell: bash
        env:
          BETA_SMOKE_EMAIL: ${{ secrets.BETA_RC_SMOKE_EMAIL }}
          BETA_SMOKE_PASSWORD: ${{ secrets.BETA_RC_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BETA_SMOKE_EMAIL}" ] || [ -z "${BETA_SMOKE_PASSWORD}" ]; then
            echo "::error::BETA_RC_SMOKE_EMAIL and BETA_RC_SMOKE_PASSWORD are required for authenticated Playwright evidence."
            exit 1
          fi
          if [ -z "${BETA_SMOKE_ORG_LABEL}" ]; then
            echo "::error::smoke_tenant_label is required for authenticated Playwright evidence."
            exit 1
          fi

      - name: Authenticate sanitized smoke tenant
        if: inputs.authenticated_smoke && !inputs.use_test_org
        env:
          BETA_SMOKE_EMAIL: ${{ secrets.BETA_RC_SMOKE_EMAIL }}
          BETA_SMOKE_PASSWORD: ${{ secrets.BETA_RC_SMOKE_PASSWORD }}
          BETA_SMOKE_ORG_ID: ${{ inputs.smoke_org_id }}
        run: node app/scripts/beta-evidence/auth-setup.mjs

      - name: Require TEST org prerequisites
        if: inputs.authenticated_smoke && inputs.use_test_org
        shell: bash
        env:
          BETA_SMOKE_EMAIL: ${{ secrets.TEST_STAGING_EMAIL }}
          BETA_SMOKE_PASSWORD: ${{ secrets.TEST_STAGING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BETA_SMOKE_EMAIL}" ] || [ -z "${BETA_SMOKE_PASSWORD}" ]; then
            echo "::error::TEST_STAGING_EMAIL and TEST_STAGING_PASSWORD are required for TEST Org Playwright evidence."
            exit 1
          fi
          if [ -z "${BETA_SMOKE_ORG_LABEL}" ]; then
            echo "::error::smoke_tenant_label is required for authenticated Playwright evidence."
            exit 1
          fi

      - name: Authenticate TEST org tenant
        if: inputs.authenticated_smoke && inputs.use_test_org
        env:
          BETA_SMOKE_EMAIL: ${{ secrets.TEST_STAGING_EMAIL }}
          BETA_SMOKE_PASSWORD: ${{ secrets.TEST_STAGING_PASSWORD }}
          BETA_SMOKE_ORG_ID: ${{ inputs.smoke_org_id }}
        run: node app/scripts/beta-evidence/auth-setup.mjs

      - name: Record Playwright version and discovered tests
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright --version | tee artifacts/playwright-agent-evidence/playwright-version.txt
          npm run test:e2e:list | tee artifacts/playwright-agent-evidence/test-list.txt

      - name: Run Playwright agent suite in Chromium
        env:
          # Inputs reach the shell only through the environment: direct
          # ${{ inputs.* }} interpolation into a run script is a template
          # injection (a crafted spec_file could execute before Playwright).
          SPEC_FILE: ${{ inputs.spec_file }}
        run: |
          if [ -n "${SPEC_FILE}" ]; then
            # A hyphen-leading value would be parsed as a Playwright CLI
            # option, not a spec path. Valid spec paths never start with one.
            # The "Validate spec_file" step already proved this is one exact
            # checked-in spec file, so the positional argument selects
            # exactly that file rather than a substring filter.
            case "${SPEC_FILE}" in
              -*)
                echo "::error::spec_file must be a spec file path, not a Playwright CLI option."
                exit 1
                ;;
            esac
            npx --no-install playwright test --project=chromium "${SPEC_FILE}"
          else
            npx --no-install playwright test --project=chromium
          fi

      - name: Remove runtime storage state
        if: always()
        shell: bash
        run: rm -f "${TRADEOS_AGENT_STORAGE_STATE:-}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-agent-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/playwright-agent-evidence
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30
