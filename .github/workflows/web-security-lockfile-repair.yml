name: Web security lockfile repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.head_ref == 'fix/web-uri-query-dependency-advisories'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/web-uri-query-dependency-advisories
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate lockfile only
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched production dependency tree
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- web/package-lock.json
          if git diff --quiet -- web/package-lock.json; then
            echo 'No lockfile change produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          git commit -m 'fix(deps): synchronize patched web lockfile'
          git push origin HEAD:fix/web-uri-query-dependency-advisories
