name: S027 one-time evidence dispatch

on:
  push:
    branches:
      - test/s027-browser-completion
    paths:
      - .github/workflows/s027-dispatch-evidence.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GITHUB_API_TOKEN: ${{ github.token }}
      BASE_URL: https://tradeos-costbook-4vlnw7sq3-billykshowalters.vercel.app
      DEPLOYED_SHA: 7d353ee39e7998d5213207e45443d392665d822e
      BRANCH: test/s027-browser-completion
      ORG_LABEL: TradeOS Beta Smoke
      ORG_ID: 9814bd72-626a-42f4-8871-cd755cb9d685
    steps:
      - name: Dispatch authenticated evidence with sanitized tenant confirmation
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg ref "${BRANCH}" \
            --arg base_url "${BASE_URL}" \
            --arg expected_sha "${DEPLOYED_SHA}" \
            --arg label "${ORG_LABEL}" \
            --arg org_id "${ORG_ID}" \
            '{ref:$ref,inputs:{base_url:$base_url,expected_sha:$expected_sha,smoke_tenant_label:$label,smoke_org_id:$org_id,sanitized_tenant:"true"}}')"
          code="$(curl --silent --show-error --max-time 30 -o /tmp/dispatch-response -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/404TradeOS-LLC/TradeOS/actions/workflows/s027-browser-evidence.yml/dispatches" \
            --data "${payload}")"
          [ "${code}" = "204" ] || { cat /tmp/dispatch-response; exit 1; }
          echo "Dispatched sanitized-tenant browser evidence for ${BASE_URL}."
