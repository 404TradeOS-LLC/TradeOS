name: Qodana Code Quality

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  qodana:
    name: Qodana code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: -i,app,-i,web
          pr-mode: true
          use-caches: true
          cache-default-branch-only: true
          post-pr-comment: false
          use-annotations: true
          upload-result: true
          artifact-name: qodana-report
          push-fixes: none
