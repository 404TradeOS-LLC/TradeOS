name: S027 one-time Vercel Preview build and evidence dispatch

on:
  push:
    branches:
      - test/s027-browser-completion
    paths:
      - .github/workflows/s027-configure-vercel-preview.yml

permissions:
  contents: write
  actions: write

jobs:
  configure-build-dispatch:
    if: github.ref_name == 'test/s027-browser-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: team_nY1VrcaEYEr4rcW7Gxweq7LP
      VERCEL_PROJECT_ID: prj_jDyORkIa7ug3ZtgtNujwEa65hQ36
      VERCEL_TEAM_ID: team_nY1VrcaEYEr4rcW7Gxweq7LP
      PREVIEW_BRANCH: test/s027-browser-completion
      PREVIEW_SUPABASE_URL: https://qfbgdkbamfaasmtjfyru.supabase.co
      REPO: 404TradeOS-LLC/TradeOS
      EVIDENCE_WORKFLOW: s027-browser-evidence.yml

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure branch-scoped Vercel Preview URL
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -n             --arg key "NEXT_PUBLIC_SUPABASE_URL"             --arg value "$PREVIEW_SUPABASE_URL"             --arg branch "$PREVIEW_BRANCH"             '{key: $key, value: $value, type: "plain", target: ["preview"], gitBranch: $branch, comment: "S027 authenticated browser evidence Preview data-plane URL"}')"
          response="$(curl -sS             -X POST             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             --data "$body"             -w $'\n%{http_code}'             "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_TEAM_ID")"
          status="${response##*$'\n'}"
          payload="${response%$'\n'*}"
          case "$status" in
            2??) echo "Vercel Preview URL configured." ;;
            *) echo "Vercel environment update failed (HTTP $status)."; echo "$payload"; exit 1 ;;
          esac

      - name: Force a real Vercel Preview build
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$PREVIEW_BRANCH" "$GITHUB_SHA"
          npx --yes vercel@latest deploy web             --force             --non-interactive             --yes             --token "$VERCEL_TOKEN"             --scope billykshowalters             > /tmp/s027-deploy-output.txt
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/s027-deploy-output.txt | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in
            https://*.vercel.app) ;;
            *) echo "Could not identify the Vercel Preview URL."; tail -n 40 /tmp/s027-deploy-output.txt; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment created."

      - name: Wait for and attest the Preview
        id: attest
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(curl -sS               -H "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v13/deployments/${DEPLOYMENT_URL#https://}?teamId=$VERCEL_TEAM_ID")"
            state="$(jq -r '.readyState // .state // empty' <<<"$response")"
            case "$state" in
              READY)
                sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$response")"
                ref="$(jq -r '.meta.githubCommitRef // empty' <<<"$response")"
                if [ "$sha" != "$EXPECTED_SHA" ] || [ "$ref" != "$PREVIEW_BRANCH" ]; then
                  echo "Preview metadata mismatch."
                  jq '{readyState,meta:{githubCommitSha,githubCommitRef}}' <<<"$response"
                  exit 1
                fi
                echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
                echo "sha=$sha" >> "$GITHUB_OUTPUT"
                echo "Ready Preview attested: $ref @ $sha."
                exit 0
                ;;
              ERROR|CANCELED)
                echo "Preview ended in $state."
                jq '{readyState,state,buildError,meta}' <<<"$response"
                exit 1
                ;;
            esac
            echo "Preview state: ${state:-pending} (attempt $attempt/90)"
            sleep 10
          done
          echo "Timed out waiting for Preview."
          exit 1

      - name: Dispatch authenticated browser evidence
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.attest.outputs.url }}
          DEPLOYMENT_SHA: ${{ steps.attest.outputs.sha }}
        run: |
          set -euo pipefail
          dispatch_body="$(jq -n             --arg ref "$PREVIEW_BRANCH"             --arg base_url "$DEPLOYMENT_URL"             --arg expected_sha "$DEPLOYMENT_SHA"             '{
              ref: $ref,
              inputs: {
                base_url: $base_url,
                expected_sha: $expected_sha,
                smoke_tenant_label: "TradeOS Beta Smoke",
                smoke_org_id: "9814bd72-626a-42f4-8871-cd755cb9d685",
                sanitized_tenant: "true"
              }
            }')"
          status="$(curl -sS -o /tmp/s027-dispatch-response -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             --data "$dispatch_body"             "https://api.github.com/repos/$REPO/actions/workflows/$EVIDENCE_WORKFLOW/dispatches")"
          if [ "$status" != "204" ]; then
            echo "Browser evidence dispatch failed (HTTP $status)."
            cat /tmp/s027-dispatch-response
            exit 1
          fi
          echo "S027 browser evidence dispatched."

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file_json="$(curl -sS             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/contents/.github/workflows/s027-configure-vercel-preview.yml?ref=$PREVIEW_BRANCH")"
          file_sha="$(jq -r '.sha // empty' <<<"$file_json")"
          if [ -z "$file_sha" ]; then
            echo "One-time workflow already removed."
            exit 0
          fi
          delete_body="$(jq -n             --arg message "chore(s027): remove one-time Vercel build workflow"             --arg sha "$file_sha"             --arg branch "$PREVIEW_BRANCH"             '{message: $message, sha: $sha, branch: $branch}')"
          curl -sS -f             -X DELETE             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             --data "$delete_body"             "https://api.github.com/repos/$REPO/contents/.github/workflows/s027-configure-vercel-preview.yml"             >/dev/null
          echo "One-time workflow removed."
