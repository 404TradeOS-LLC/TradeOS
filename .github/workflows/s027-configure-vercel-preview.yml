name: S027 one-time Preview wiring and evidence dispatch

on:
  push:
    branches:
      - test/s027-browser-completion
    paths:
      - .github/workflows/s027-configure-vercel-preview.yml

permissions:
  contents: read
  actions: write

jobs:
  configure-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_API_TOKEN: \${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_nY1VrcaEYEr4rcW7Gxweq7LP
      FRONTEND_PROJECT_ID: prj_jDyORkIa7ug3ZtgtNujwEa65hQ36
      RC_BRANCH: test/s027-browser-completion
      STAGING_SUPABASE_URL: https://qfbgdkbamfaasmtjfyru.supabase.co
      STAGING_BACKEND_URL: https://tradeos-costbook-git-staging-billykshowalters.vercel.app
      SMOKE_ORG_LABEL: TradeOS Beta Smoke
      SMOKE_ORG_ID: 9814bd72-626a-42f4-8871-cd755cb9d685
    steps:
      - uses: actions/checkout@v4

      - name: Verify token and branch
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "::error::VERCEL_TOKEN is missing."; exit 1; }
          [ "${GITHUB_REF_NAME}" = "${RC_BRANCH}" ] || { echo "::error::Unexpected branch."; exit 1; }

      - name: Configure branch-scoped Preview variables
        shell: bash
        run: |
          set -euo pipefail
          upsert() {
            local key="$1"
            local value="$2"
            curl --fail --silent --show-error --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v10/projects/${FRONTEND_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}" \
              --data "$(jq -n --arg key "${key}" --arg value "${value}" --arg branch "${RC_BRANCH}" \
                '{key:$key,value:$value,type:"plain",target:["preview"],gitBranch:$branch}')"
            echo "Configured ${key} for branch-scoped Preview."
          }
          upsert NEXT_PUBLIC_SUPABASE_URL "${STAGING_SUPABASE_URL}"
          upsert BACKEND_API_URL "${STAGING_BACKEND_URL}"

      - name: Force a fresh Vercel Preview build
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx --yes vercel@latest deploy --force --non-interactive --yes \
            --token="${VERCEL_TOKEN}" --scope="${VERCEL_TEAM_ID}" \
            --meta githubCommitRef="${RC_BRANCH}" \
            --meta githubCommitSha="${GITHUB_SHA}" 2>&1 | tee /tmp/vercel-deploy.log)"
          deployment_url="$(printf '%s\n' "${output}" | grep -Eo 'https://[[:alnum:]._~-]+\.vercel\.app' | tail -n 1)"
          [ -n "${deployment_url}" ] || { echo "::error::Could not determine Vercel deployment URL."; exit 1; }
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Fresh Preview deployment: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Wait for Preview response
        id: attest
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          status=""
          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "${deployment_url}/login" || true)"
            echo "Preview HTTP status: ${status}"
            if [ "${status}" = "200" ] || [ "${status}" = "302" ]; then
              break
            fi
            sleep 5
          done
          case "${status}" in
            200|302) ;;
            *) echo "::error::Preview did not become reachable."; exit 1 ;;
          esac

      - name: Dispatch authenticated browser evidence
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.deploy.outputs.deployment_url }}"
          payload="$(jq -n \
            --arg ref "${RC_BRANCH}" \
            --arg base_url "${base_url}" \
            --arg expected_sha "${GITHUB_SHA}" \
            --arg label "${SMOKE_ORG_LABEL}" \
            --arg org_id "${SMOKE_ORG_ID}" \
            '{ref:$ref,inputs:{base_url:$base_url,expected_sha:$expected_sha,smoke_tenant_label:$label,smoke_org_id:$org_id,sanitized_tenant:"false"}}')"
          code="$(curl --silent --show-error --max-time 30 -o /tmp/dispatch-response -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/404TradeOS-LLC/TradeOS/actions/workflows/s027-browser-evidence.yml/dispatches" \
            --data "${payload}")"
          [ "${code}" = "204" ] || { cat /tmp/dispatch-response; exit 1; }
          echo "Evidence workflow dispatched for ${base_url}."

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/404TradeOS-LLC/TradeOS/contents/.github/workflows/s027-configure-vercel-preview.yml"
          file_sha="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}?ref=${RC_BRANCH}" | jq -r '.sha')"
          curl --fail --silent --show-error --max-time 30 \
            -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" \
            --data "$(jq -n --arg message "Remove one-time S027 Preview wiring helper" --arg sha "${file_sha}" --arg branch "${RC_BRANCH}" \
              '{message:$message,sha:$sha,branch:$branch}')"
          echo "Removed one-time workflow."
