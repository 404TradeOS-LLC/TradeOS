name: Reconcile production migration history

# One-time production history reconciliation for PR #30.
#
# This workflow intentionally does not run `prisma migrate deploy` and does not
# execute migration SQL. It records a migration as already applied only after the
# production environment approval gate is granted.
#
# History-only scope:
# - uses the production GitHub Environment approval gate
# - maps DATABASE_ADMIN_URL to Prisma's required DATABASE_URL input
# - runs only `prisma migrate resolve --applied` and `prisma migrate status`
# - does not create, alter, or drop database schema objects, policies, or buckets

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reconcile-production-migration-20260728120000-add-settings-asset-uploads
  cancel-in-progress: false

jobs:
  reconcile:
    name: Mark settings asset upload migration as applied
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_ADMIN_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Verify migration file checksum
        run: |
          echo "0f224dc9c71ac0b61fddb4db02b8afe1789229eebc0beb97094be8bae268a761  prisma/migrations/20260728120000_add_settings_asset_uploads/migration.sql" | sha256sum --check

      - name: Mark migration as already applied
        run: npx prisma migrate resolve --applied 20260728120000_add_settings_asset_uploads

      - name: Print migration status
        run: npx prisma migrate status
