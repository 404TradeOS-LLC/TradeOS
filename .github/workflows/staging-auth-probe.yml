name: Staging auth bypass probe

on:
  push:
    branches:
      - staging
    paths:
      - ".github/workflows/staging-auth-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify staging fixture can authorize protected API
        shell: bash
        run: |
          set -euo pipefail
          url="https://tradeos-costbook-git-staging-billykshowalters.vercel.app/api/v1/settings"
          status="$(curl -sS -o /tmp/settings.json -w '%{http_code}'             -H 'Authorization: Bearer tradeos-staging-fixture-v1' "$url")"
          echo "protected API status=$status"
          test "$status" = "200"
          jq -e 'type == "object"' /tmp/settings.json >/dev/null
          echo "PASS staging fixture protected API"
